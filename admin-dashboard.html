<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin-dashboard.css">

  </head>
  <body>
    <div class="main">
      <section class="sidebar">
        <p>Admin Dashboard</p>
        <p class="line">---------------------</p>
        <div class="sidebar-icons">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-dashboard.html">Applications</a>
          <a href="admin-dashboard.html">Reports</a>
          <a href="admin-dashboard.html">Records</a>
          <a href="admin-dashboard.html"><i class="fas fa-cog"></i> Settings</a>
          <a href="login1.html">Logout</a>
        </div>

      </section>
      <section class="core">
        <div class="welcome">
          <div>
            <h1>Welcome Extension officer👋</h1>
            <p class="manage">Manage Agri-farmers applications</p>
          </div>
          <div class="certificate">
            <div><p>Agri-farming certificate🗒️</p></div>
          </div>
        </div>
        <div class="applications">
          <div class="total"><p>Total Applications</p>
            <img
              src="images/icons8-google-forms-48.png">
            <h1 class="no">41</h1></div>
          <div class="approved"><h2>Approved </h2>
            <img
              src="images/icons8-approval-48.png">
            <h1 class="no">25</h1>
          </div>
          <div class="rejected"><h2>Rejected</h2>
            <img
              src="images/icons8-cancel-48.png">
            <h1 class="no">11</h1>
          </div>
        </div>
        <form id="profileForm" class="form">
          <!-- Step 1 -->
          <h2>Filter applications</h2>
          <div class="labels">
            <label class="sub">Subcounty</label>
            <label class="ward">Select Ward</label>
            <label class="status">Status</label>
          </div>
          <div class="step active">

            <select required>
              <option value>All subcounties</option>
              <option value="Tetu">Tetu</option>
              <option value="Mathira">Mathira</option>
              <option value="Kieni">Kieni</option>
              <option value="Othaya">Othaya</option>
              <option value="Mukurweini">Mukurweini</option>
              <option value="Nyeri-central">Nyeri Central</option>

            </select>

            <select required>
              <option value>All Wards</option>
              <option value="Tetu">Tetu</option>
              <option value="Mathira West">Mathira West</option>
              <option value="Mathira East">Mathira East</option>
              <option value="Kieni West">Kieni West</option>
              <option value="Kieni East">Kieni East</option>

            </select>

            <select required>
              <option value>Status</option>
              <option value="Pending">Pending</option>
              <option value="completed">Completed</option>
              <option value="failed">Failed</option>

            </select>
          </div>
          <div class="labels">
            <label class="sub">Date From:</label>
            <label class="date">Date To:</label>

          </div>
          <div class="step active">
            <input type="date" placeholder="Date of Birth" required>
            <input type="date" placeholder="Date of Birth" required>
          </div>
          <div class="buttons">
            <button class="reset">Reset</button>
            <button class="filter">Apply Filter</button>
          </div>

        </form>
      </section>

    </div>

  </body>
</html>
